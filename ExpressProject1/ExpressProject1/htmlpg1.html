<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Registration Form</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;

            background: linear-gradient(
                -45deg,
                #667eea,
                #764ba2,
                #6dd5ed,
                #2193b0
            );

            background-size: 400% 400%;
            animation: backgroundMove 10s ease infinite;
        }

        /* Animated background */
        @keyframes backgroundMove {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .form-container {
            width: 100%;
            max-width: 420px;

            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);

            padding: 35px;
            border-radius: 20px;

            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);

            border: 1px solid rgba(255, 255, 255, 0.3);

            animation: formAnimation 0.8s ease;
        }

        /* Form entrance animation */
        @keyframes formAnimation {
            from {
                opacity: 0;
                transform: translateY(-40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h2 {
            text-align: center;
            color: white;
            margin-bottom: 25px;
            font-size: 30px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            color: white;
            margin-bottom: 7px;
            font-size: 14px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px 14px;

            border: 2px solid transparent;
            border-radius: 10px;

            outline: none;
            font-size: 15px;

            background: rgba(255, 255, 255, 0.9);

            transition: 0.3s;
        }

        /* Input animation */
        input:focus,
        textarea:focus,
        select:focus {
            border-color: #ffffff;
            transform: scale(1.02);

            box-shadow:
                0 0 0 3px rgba(255, 255, 255, 0.2),
                0 5px 15px rgba(0, 0, 0, 0.15);
        }

        textarea {
            resize: none;
        }

        .gender-group {
            display: flex;
            gap: 20px;
            margin-top: 8px;
        }

        .gender-group label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .gender-group input {
            width: auto;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        button {
            flex: 1;

            border: none;
            padding: 13px;

            border-radius: 10px;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .register-btn {
            background: white;
            color: #6a5acd;
        }

        .reset-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid white;
        }

        /* Button hover animation */
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.25);
        }

        button:active {
            transform: scale(0.96);
        }

        .register-btn:hover {
            background: #f1f1f1;
        }

        .reset-btn:hover {
            background: rgba(255, 255, 255, 0.35);
        }

        /* Mobile responsive */
        @media (max-width: 500px) {

            body {
                padding: 20px;
            }

            .form-container {
                padding: 25px;
            }

            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="form-container">

        <h2>Register</h2>

        <form>

            <div class="input-group">
                <label for="name">Full Name</label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >
            </div>

            <div class="input-group">
                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="input-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >
            </div>

            <div class="input-group">
                <label for="phone">Phone Number</label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter phone number"
                >
            </div>

            <div class="input-group">

                <label>Gender</label>

                <div class="gender-group">

                    <label>
                        <input
                            type="radio"
                            name="gender"
                            value="Male"
                        >
                        Male
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="gender"
                            value="Female"
                        >
                        Female
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="gender"
                            value="Other"
                        >
                        Other
                    </label>

                </div>
            </div>

            <div class="input-group">

                <label for="dob">
                    Date of Birth
                </label>

                <input
                    type="date"
                    id="dob"
                    name="dob"
                >

            </div>

            <div class="input-group">

                <label for="address">
                    Address
                </label>

                <textarea
                    id="address"
                    name="address"
                    rows="3"
                    placeholder="Enter your address"
                ></textarea>

            </div>

            <div class="buttons">

                <button
                    type="submit"
                    class="register-btn"
                >
                    Register
                </button>

                <button
                    type="reset"
                    class="reset-btn"
                >
                    Reset
                </button>

            </div>

        </form>

    </div>

</body>
</html>
